spring:
  application:
    name: ai-agent
  profiles:
    active: local
server:
  port: 8124
  servlet:
    context-path: /api
# 修改日志级别，查看 Spring AI 更多调用细节
logging:
  level:
    org.springframework.ai: DEBUG







#springdoc-openapi配置
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs
  group-configs:
    - group: 'default'
      paths-to-match: '/**'
      packages-to-scan: com.xiaoli.aiagent.controller
# knife4j配置
knife4j:
  enable: true
  setting:
    language: zh_cn