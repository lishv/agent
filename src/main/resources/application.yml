spring:
  application:
    name: ai-agent
  profiles:
    active: local

  ai:
    vectorstore:
      pgvector:
        index-type: HNSW
        distance-type: COSINE_DISTANCE
        dimensions: 1024
        max-document-batch-size: 10000 # Optional: Maximum number of documents per batch
# MCP 客户端配置
    mcp:
      client:
        sse:
          connections:
            server1:
              url: http://huilingyun.asia:8127
#        stdio:
#          servers-configuration: classpath:mcp-servers.json
    #大模型失败调用重试配置
    retry:
      # 首次调用 + 最多重试 4 次
      max-attempts: 4
      backoff:
        initial-interval: 1s
        multiplier: 2
        max-interval: 5s
      on-client-errors: false

server:
  port: 8124
  servlet:
    context-path: /api

# 修改日志级别，查看 Spring AI 更多调用细节
logging:
  level:
    org.springframework.ai: DEBUG







#springdoc-openapi配置
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs
  group-configs:
    - group: 'default'
      paths-to-match: '/**'
      packages-to-scan: com.xiaoli.aiagent.controller
# knife4j配置
knife4j:
  enable: true
  setting:
    language: zh_cn
